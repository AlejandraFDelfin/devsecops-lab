name: Pipeline DevSecOps End-to-End

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:

  # 1. SECRET SCANNING
  secret-scanning:
    name: 1. Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # 2. SAST
  sast:
    name: 2. SAST (Semgrep)
    needs: secret-scanning
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Ejecutar Semgrep en app/
        run: |
          docker run --rm \
          -v "${{ github.workspace }}:/src" \
          returntocorp/semgrep \
          semgrep scan --config auto --error app/


  # 3. SCA
  sca:
    name: 3. SCA (Trivy Filesystem)
    needs: secret-scanning
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Escaneo de librerías con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: app/
          severity: HIGH,CRITICAL
          exit-code: 1


  # 4. IaC SECURITY
  iac-security:
    name: 4. IaC Security (Checkov)
    needs: secret-scanning
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Escaneo IaC con Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform,dockerfile
          soft_fail: false
          skip_check: |
            CKV_AWS_18,
            CKV_AWS_21,
            CKV_AWS_144,
            CKV_AWS_145,
            CKV2_AWS_6,
            CKV2_AWS_61,
            CKV2_AWS_62,
            CKV_AWS_260



  # 5. BUILD + SBOM + SCAN + PUSH
  build-and-sbom:
    name: 5. Build, Container Scan & SBOM
    needs:
      - sast
      - sca
      - iac-security

    runs-on: ubuntu-latest

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: alejandrafdelfin/devsecops-lab


    outputs:
      digest: ${{ steps.push-image.outputs.digest }}


    steps:

      - uses: actions/checkout@v4


      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Metadata imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha


      - name: Build imagen local
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}


      - name: Generar SBOM CycloneDX
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.meta.outputs.tags }}
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json


      - name: Publicar SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json


      - name: Trivy Container Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          severity: CRITICAL
          exit-code: 1


      - name: Push imagen GHCR
        id: push-image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}



  # 6. COSIGN
  sign-container:
    name: 6. Firma de Artefacto (Cosign Keyless)

    needs: build-and-sbom

    runs-on: ubuntu-latest


    env:
      IMAGE_NAME: alejandrafdelfin/devsecops-lab


    steps:


      - name: Instalar Cosign
        uses: sigstore/cosign-installer@v3.5.0



      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}



      - name: Firmar imagen por digest
        env:
          IMAGE_REF: ghcr.io/alejandrafdelfin/devsecops-lab@${{ needs.build-and-sbom.outputs.digest }}

        run: |
          echo "Firmando imagen:"
          echo "$IMAGE_REF"

          cosign sign --yes "$IMAGE_REF"